# Pre-commit hook for nmisp.
#
# Runs the same Colab-badge / cell-id / trailing-whitespace cleanup that CI's
# `Add Google Colab Badges` job performs, so notebook-touching commits arrive
# already-normalized. CI then has nothing to clean and the `Clean ipynb` auto-
# commit cycle is avoided.
#
# One-time setup per clone:
#   uv tool install pre-commit       # or: pipx install pre-commit
#   pre-commit install
#
# Requires `uv` on PATH so PEP 723 inline deps in the script resolve without
# touching the conda env.

repos:
  - repo: local
    hooks:
      - id: nmisp-colab-badges
        name: Add Colab badges + normalize notebook cells
        entry: uv run utils/add_colab_main_buttons.py
        language: system
        types: [jupyter]
        pass_filenames: false
        require_serial: true
